# Frozen DeBERTa-v3-base on the claim alone.
data:
  train_files: [data/misinfo_SFT_train_for_cot_aug.json, data/misinfo_RL_train_for_cot_aug.json]
  use_arguments: false
  max_length: 100
  val_fraction: 0.2
  split: ordered

model:
  encoder: microsoft/deberta-v3-base
  attention: baseline
  gru_dropout: 0.4

train:
  seed: 42
  batch_size: 32
  epochs: 100
  patience: 3
  monitor: loss
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  loss: bce
  output: checkpoints/deberta_claim_only.pt
