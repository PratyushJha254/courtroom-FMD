# FinBERT on the claim alone, top two layers unfrozen.
data:
  train_files: [data/misinfo_SFT_train_for_cot_aug.json, data/misinfo_RL_train_for_cot_aug.json]
  use_arguments: false
  max_length: 100
  val_fraction: 0.2
  split: ordered

model:
  encoder: ProsusAI/finbert
  attention: baseline
  gru_dropout: 0.4

train:
  seed: 42
  batch_size: 32
  epochs: 100
  patience: 4
  monitor: loss
  optimizer: adamw
  lr: 1.0e-5
  encoder_lr: 1.0e-6
  unfreeze_last_n: 2
  weight_decay: 0.01
  loss: bce
  output: checkpoints/finbert_claim_only.pt
