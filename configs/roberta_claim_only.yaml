# Table 1, first row: frozen RoBERTa-base on the claim alone.
data:
  train_files: [data/misinfo_SFT_train_for_cot_aug.json, data/misinfo_RL_train_for_cot_aug.json]
  use_arguments: false
  max_length: 100
  val_fraction: 0.2
  split: ordered

model:
  encoder: roberta-base
  attention: baseline
  gru_dropout: 0.4

train:
  seed: 42
  batch_size: 32
  epochs: 75
  patience: 3
  monitor: loss
  optimizer: adam
  lr: 1.0e-5
  weight_decay: 0.0
  loss: bce
  output: checkpoints/roberta_claim_only.pt
